name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a branch be published by hand from the Actions tab before it is merged.
  workflow_dispatch:

# The build output is the whole site, so a queued run can safely replace an older one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same checks CI runs: a broken build should not replace a working site.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # enablement flips the repository's Pages source to "GitHub Actions" itself, so
      # the first run does not need anyone to visit the settings page.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
